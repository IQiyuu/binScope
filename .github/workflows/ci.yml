name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gawk valgrind binutils

      - name: Build
        run: make

      - name: Compare with readelf
        run: |
          tests/compare_dynsym.sh /bin/ls
          tests/compare_dynsym.sh /usr/bin/python3

      - name: Robustness (truncated and invalid files)
        run: tests/robustness.sh

      - name: Valgrind
        run: tests/valgrind.sh